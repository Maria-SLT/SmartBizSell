<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Каталог компаний — v25</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    /* компактная сетка каталога */
    .catalog{ max-width:1200px; margin:40px auto; padding:0 20px; }
    .catalog-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:24px; }
    .card{ background:#fff; padding:16px; text-decoration:none; color:#111; display:block; }
    .card:hover{ background:#f5f5f5; }
    .card img{ width:100%; height:140px; object-fit:cover; display:block; }
    .card .h{ font:600 16px "Roboto Flex", system-ui; margin:12px 0 4px; }
    .card .s{ font:400 14px "Roboto Flex", system-ui; color:#555; margin:0; }
  </style>
</head>
<body>
  <main class="catalog">
    <h1 class="h">Каталог компаний</h1>
    <div class="catalog-grid">
      <!-- Пример двух карточек; добавляйте свои -->
      <a class="card" href="/teaser.html?company=pins">
        <img src="assets/img/pins/photo-2.jpg" alt="">
        <div class="h">Pins</div>
        <p class="s">Готовая еда</p>
      </a>

      <a class="card" href="/teaser.html?company=fitocosmetic">
        <img src="assets/img/fitocosmetic/photo-1.jpg" alt="">
        <div class="h">Fitocosmetic</div>
        <p class="s">Производство косметики</p>
      </a>
      <!-- … -->
    </div>
    </p></p>

    <a href="/teaser.html?company=pins">Pins</a>
    <a href="/teaser.html?company=fitocosmetic">Fitocosmetic</a>

  </main>
</body>
</html>
