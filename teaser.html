  <script>
    const HIGHLIGHT_ICON_MAP = {
      automation: "assets/icons/highlights/automation.svg",
      capacity: "assets/icons/highlights/capacity.svg",
      employees: "assets/icons/highlights/employees.svg",
      equipment: "assets/icons/highlights/equipment.svg",
      export: "assets/icons/highlights/export.svg",
      factory: "assets/icons/highlights/factory.svg",
      general: "assets/icons/highlights/general.svg",
      geography: "assets/icons/highlights/geography.svg",
      growth: "assets/icons/highlights/growth.svg",
      innovation: "assets/icons/highlights/innovation.svg",
      locations: "assets/icons/highlights/locations.svg",
      logistics: "assets/icons/highlights/logistics.svg",
      margin: "assets/icons/highlights/margin.svg",
      network: "assets/icons/highlights/network.svg",
      offline: "assets/icons/highlights/offline.svg",
      online: "assets/icons/highlights/online.svg",
      output: "assets/icons/highlights/output.svg",
      products: "assets/icons/highlights/products.svg",
      profit: "assets/icons/highlights/profit.svg",
      quality: "assets/icons/highlights/quality.svg",
      revenue: "assets/icons/highlights/revenue.svg",
      share: "assets/icons/highlights/share.svg",
      time: "assets/icons/highlights/time.svg",
      warehouse: "assets/icons/highlights/warehouse.svg"
    };

    function getCompanySlug() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('company');
      // company=... или fallback на дефолтную компанию
      return slug || 'default';
    }

    async function main() {
      try {
        const slug = getCompanySlug();
        const url = `data/companies/${encodeURIComponent(slug)}.json`;

        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) {
          console.error('Ошибка загрузки данных компании:', slug, res.status, res.statusText);
          return;
        }
        const data = await res.json();

        // Topline
        const inv = document.getElementById('invopportunity');
        if (inv && data.invopportunity) inv.textContent = data.invopportunity;

        const contactBtn = document.getElementById('contact-btn');
        if (contactBtn && data.contact) {
          contactBtn.textContent = data.contact.label || '';
          contactBtn.href = data.contact.href || '#contacts';
        }

        // Header
        const kd = document.getElementById('keydescription-text');
        if (kd && data.keydescription) kd.textContent = data.keydescription;

        // Tags
        const tags = document.getElementById('tags');
        if (tags) {
          tags.innerHTML = '';
          (data.tags || []).forEach(t => {
            const el = document.createElement('span');
            el.className = 'tag-pill';
            el.textContent = t;
            tags.appendChild(el);
          });
        }

        // Title summary
        const ts = document.getElementById('titlesummary-title');
        if (ts && data.titlesummaryTitle) ts.textContent = data.titlesummaryTitle;

        // Summary
        const summary = document.getElementById('summary');
        if (summary) {
          summary.innerHTML = '';
          (data.summary || []).forEach(item => {
            const box = document.createElement('div');
            box.className = 'summary-item';

            const d = document.createElement('div');
            d.className = 'summary-descriptor';
            d.textContent = item.label || '';

            const v = document.createElement('div');
            v.className = 'summary-value';
            v.textContent = item.value || '';

            box.appendChild(d);
            box.appendChild(v);
            summary.appendChild(box);
          });
        }

        // General info
        const gi = document.getElementById('generalinfo');
        if (gi) {
          gi.innerHTML = '';
          (data.generalinfo || '')
            .split(/\n\s*\n+/)
            .map(t => t.trim())
            .filter(Boolean)
            .forEach(text => {
              const p = document.createElement('p');
              p.textContent = text;
              gi.appendChild(p);
            });
        }

        // Video
        const videoWrap = document.getElementById('video-wrapper');
        const videoFrame = document.getElementById('video-frame');
        if (videoWrap && videoFrame) {
          if (data.video && data.video.src) {
            videoFrame.src = data.video.src;
            videoWrap.style.display = 'block';
          } else {
            videoWrap.style.display = 'none';
          }
        }

        // Highlights
        const hl = document.getElementById('highlights');
        if (hl) {
          hl.innerHTML = '';
          (data.highlights || []).forEach(h => {
            const item = document.createElement('div');
            item.className = 'highlight-item';

            const icon = document.createElement('div');
            icon.className = 'highlight-icon';

            const iconKey = h.icon || 'general';
            const iconFile = HIGHLIGHT_ICON_MAP[iconKey] || HIGHLIGHT_ICON_MAP['general'];

            icon.style.backgroundImage = `url('${iconFile}')`;
            icon.style.backgroundSize = 'contain';
            icon.style.backgroundRepeat = 'no-repeat';
            icon.style.backgroundPosition = 'center';

            const right = document.createElement('div');
            right.className = 'highlight-text';

            const val = document.createElement('div');
            val.className = 'highlight-value';
            val.textContent = h.value || '';

            const desc = document.createElement('div');
            desc.className = 'highlight-desc';
            desc.textContent = h.label || '';

            right.appendChild(val);
            right.appendChild(desc);
            item.appendChild(icon);
            item.appendChild(right);
            hl.appendChild(item);
          });
        }

        // Financials
        const finTitle = document.getElementById('financials-title');
        if (finTitle && data.financialsTitle) {
          finTitle.textContent = data.financialsTitle;
        }

        // Illustrations
        const ill = document.getElementById('illustrations');
        if (ill) {
          ill.innerHTML = '';
          const imgs = data.illustrations || [];
          if (imgs.length > 0) {
            imgs.forEach(src => {
              const wrap = document.createElement('div');
              wrap.className = 'illustration-item';
              const img = document.createElement('img');
              img.src = src;
              img.alt = '';
              wrap.appendChild(img);
              ill.appendChild(wrap);
            });
          } else {
            const divider = document.createElement('hr');
            divider.className = 'illustrations-divider';
            ill.appendChild(divider);
          }
        }

        // Advantages
        const advTitle = document.getElementById('advantages-title');
        if (advTitle && data.advantagesTitle) {
          advTitle.textContent = data.advantagesTitle;
        }
        const advList = document.getElementById('advantages-list');
        if (advList) {
          advList.innerHTML = '';
          (data.advantages || []).forEach(text => {
            const pill = document.createElement('div');
            pill.className = 'pill-item pill-adv';

            const icon = document.createElement('span');
            icon.className = 'pill-icon pill-icon-check';
            icon.textContent = '✓';

            const span = document.createElement('span');
            span.className = 'pill-text';
            span.textContent = text;

            pill.appendChild(icon);
            pill.appendChild(span);
            advList.appendChild(pill);
          });
        }

        // Risks
        const risksTitle = document.getElementById('risks-title');
        if (risksTitle && data.risksTitle) {
          risksTitle.textContent = data.risksTitle;
        }
        const risksList = document.getElementById('risks-list');
        if (risksList) {
          risksList.innerHTML = '';
          (data.risks || []).forEach(text => {
            const pill = document.createElement('div');
            pill.className = 'pill-item pill-risk';

            const icon = document.createElement('span');
            icon.className = 'pill-icon pill-icon-warning';
            icon.textContent = '!';

            const span = document.createElement('span');
            span.className = 'pill-text';
            span.textContent = text;

            pill.appendChild(icon);
            pill.appendChild(span);
            risksList.appendChild(pill);
          });
        }

        // Proposal
        const proposalText = document.getElementById('proposal-text');
        if (proposalText && data.proposal) {
          proposalText.textContent = data.proposal;
        }

        // Contacts
        const contactsTitle = document.getElementById('contacts-title');
        if (contactsTitle && data.contactsTitle) {
          contactsTitle.textContent = data.contactsTitle;
        }
        const contactsBox = document.getElementById('contacts-box');
        if (contactsBox) {
          contactsBox.innerHTML = '';
          (data.contacts || []).forEach(c => {
            const row = document.createElement('div');
            row.className = 'contact-row';

            const label = document.createElement('span');
            label.className = 'contact-label';
            label.textContent = (c.label || '') + ':';

            const link = document.createElement('a');
            link.className = 'contact-link';
            link.textContent = c.value || '';
            if (c.href) link.href = c.href;

            row.appendChild(label);
            row.appendChild(link);
            contactsBox.appendChild(row);
          });
        }

        // Buttons
        const btnClose = document.getElementById('btn-close');
        const btnCta = document.getElementById('btn-contact-seller');
        if (data.buttons) {
          if (btnClose) btnClose.textContent = data.buttons.close || '';
          if (btnCta) btnCta.textContent = data.buttons.contactSeller || '';
        }
      } catch (err) {
        console.error('Ошибка инициализации страницы:', err);
      }
    }

    main();
  </script>
</body>
</html>
